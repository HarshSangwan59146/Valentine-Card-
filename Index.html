<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Be My Valentine ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card" id="proposalCard">
        <h1>Will You Be My Valentine? 💖</h1>
        <div class="buttons">
            <button class="btn yes" id="yesBtn">Yes ❤️</button>
            <button class="btn no" id="noBtn">No 🙈</button>
        </div>
    </div>

    <div class="success hidden" id="successMessage">
        <h2>Happy Valentine's Day 💕</h2>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRg5IhAfv2AlU5US4zHTDkAj-o80YcYsODdpQ&s" alt="Love Image" id="loveImage">
        <p>You just made my day special! 💖</p>
    </div>

    <div class="hearts" id="heartsContainer"></div>

    <script src="script.js"></script>
</body>

</html>
